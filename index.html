const HANDOFF_CHARS='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';

function handoffCheck(body){let s=0;for(let i=0;i<body.length;i++)s+=(HANDOFF_CHARS.indexOf(body[i])+1)*(i+1);return HANDOFF_CHARS[s%32];}
function handoffEncode(){try{const B=BigInt,n=questions.length;let v=B(0);for(let i=n-1;i>=0;i--){const a=answers[i];if(!(a>=1&&a<=5))return '';v=v*B(5)+B(a-1);}if(graduation===null||graduation===undefined)return '';v+=B(graduation*2+(rareRoll?1:0))*(B(5)**B(n));let body='';const L=handoffLen();for(let i=0;i<L;i++){body=HANDOFF_CHARS[Number(v%B(32))]+body;v=v/B(32);}const full=body+handoffCheck(body);return full.match(/.{1,4}/g).join('-');}catch(e){return '';}}
function handoffDecode(text){try{const B=BigInt,n=questions.length;const s=String(text||'').toUpperCase().replace(/[^0-9A-Z]/g,'');const L=handoffLen();if(s.length!==L+1)return null;for(const c of s)if(HANDOFF_CHARS.indexOf(c)<0)return null;const body=s.slice(0,L);if(handoffCheck(body)!==s[L])return null;let v=B(0);for(const c of body)v=v*B(32)+B(HANDOFF_CHARS.indexOf(c));if(v>=handoffMax())return null;const base=B(5)**B(n);const head=Number(v/base);let low=v%base;const g=Math.floor(head/2),rare=head%2===1;if(g>=years.length)return null;const a=[];for(let i=0;i<n;i++){a.push(Number(low%B(5))+1);low=low/B(5);}return {graduation:g,rare,answers:a};}catch(e){return null;}}
