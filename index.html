function normalizePhone(value){let p=value.normalize('NFKC').replace(/[\s()（）-]/g,'');if(p.startsWith('+81'))p='0'+p.slice(3);return p}
function isValidPhone(value){return /^0[1-9][0-9]{8,9}$/.test(normalizePhone(value))}
function isValidEmail(value){return value===''||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)}

function showAdvisors(){quizCleanup();step=64;app.innerHTML=`<section class="support-page advisors-view mentor-directory"><p class="page-kicker">メンター紹介</p>${supportIllustration('peers')}<h1><span class="nb">就活を終えた</span><span class="nb"><span class="hl">メンター</span>に、</span><span class="nb">気軽に聞いてみよう。</span></h1><p class="advisor-intro">少し前まで、同じように悩んでいたメンター。就活で迷ったこと、試したこと、うまくいったことを聞いてみよう。</p><p class="sample-notice">メンターの紹介ページは準備中です。写真はAI生成、プロフィールと相談内容は仮のサンプルです。</p><div class="mentor-filters" role="group" aria-label="相談テーマで絞り込み"><button data-filter="all" aria-pressed="true">すべて</button>${advisors.map(a=>`<button data-filter="${a.id}" aria-pressed="false">${a.tags[0]}</button>`).join('')}</div><div class="mentor-list">${advisors.map(a=>`<button class="mentor-card" data-advisor="${a.id}"><span class="mentor-portrait"><img src="assets/peer-${a.id.slice(-1)}.webp" alt="メンターの仮プロフィール写真（AI生成）" width="512" height="512" loading="lazy"></span><span class="mentor-card-copy"><span class="sample-label">メンター・仮プロフィール</span><strong>${a.name}</strong><span class="mentor-message">${a.theme}</span><span class="mentor-facts"><span><b>タマ活タイプ</b>${a.type}（仮）</span><span><b>得意な相談</b>${a.tags.join('・')}</span></span><span class="mentor-voice-label">メンターからひとこと</span><span class="mentor-voice">${a.intro}</span><span class="mentor-more">プロフィールを見る →</span></span></button>`).join('')}</div><div class="mentor-bottom"><h2>相手選びに迷ったら。</h2><p>公式LINEの案内から、まずは相談のきっかけを。</p><button class="line-cta" data-go-line>公式LINEの案内を見る →</button></div></section>`;(function(){const list=app.querySelector('.mentor-list');if(!list)return;const dots=document.createElement('div');dots.className='carousel-dots mentor-dots';dots.setAttribute('aria-hidden','true');const cards=()=>[...list.querySelectorAll('.mentor-card:not([hidden])')];const paint=()=>{const c=cards();dots.innerHTML=c.map((_,i)=>`<i${i===0?' class="on"':''}></i>`).join('');list.scrollLeft=0};list.after(dots);paint();let tick=0;list.addEventListener('scroll' function showAdvisor(id){const a=advisors.find(x=>x.id===id);if(!a)return showAdvisors();quizCleanup();step=65;app.innerHTML=`<section class="support-page profile-view mentor-profile"><nav class="crumbs" aria-label="現在の位置"><button type="button" id="crumb-home">ホーム</button><span aria-hidden="true">›</span><button type="button" id="return-advisors">メンター紹介</button><span aria-hidden="true">›</span><span aria-current="page">${a.name}</span></nav><div class="mentor-profile-head"><span class="mentor-portrait"><img src="assets/peer-${a.id.slice(-1)}.webp" alt="メンターの仮プロフィール写真（AI生成）" width="512" height="512" loading="lazy"></span><p class="sample-label">メンター・仮プロフィール</p><h1>${a.name}</h1><p class="mentor-message">${a.theme}</p><div class="mentor-facts"><span><b>タマ活タイプ</b>${a.type}（仮）</span><span><b>得意な相談</b>${a.tags.join('・')}</span></div></div><p class="sample-notice">写真はAI生成です。氏名・経験・相談内容は仮のサンプルで、実在のメンターではありません。</p><section class="support-section"><h2>あなたに伝えたいこと</h2><p>${a.intro}</p></section><section class="support-section"><h2>こんな話ができます</h2><ul class="mentor-topic-list">${a.topics.map(t=>`<li>${t}</li>`).join('')}</ul></section><section class="support-section"><h2>相談の進め方</h2><p>${a.style}</p></section><section class="support-section"><h2>就活で経験したこと</h2><p>就活を終えたメンターの、悩んだこと・取り組んだこと・後輩に伝えたいことを掲載予定です。</p></section><div class="profile-booking"><h2>相談への一歩を、ここから。</h2><p>メンターとの面談受付は準備中です。公式LINEの案内をご確認ください。</p><button class="line-cta" data-go-line>公式LINEの案内を見る →</button></div></section>`;document.getElementById('return-advisors').onclick=showAdvisors;document.getElementById('crumb-home').onclick=home;wirePage();scrollTop();}


const entryPage=new URLSearchParams(location.search).get("page");if(entryPage==="types")showTypes();else if(entryPage==="advisors")showAdvisors();else if(entryPage==="line")showLine();else if(entryPage==="consult")showConsultation();else home();

function showTypeInfo(code){const entry=documentCharacters[code];if(!entry)return showTypes();quizCleanup();step=71;const selected=axes.map((a,i)=>a.letters.indexOf(code[i])),index=selected.reduce((v,x)=>v*2+x,0),p=resultProfiles[index],r=importedDiagnosis.results.find(x=>x.code===code);app.innerHTML=`<section class="type-info"><nav class="crumbs" aria-label="現在の位置"><button type="button" id="crumb-home">ホーム</button><span aria-hidden="true">›</span><button type="button" id="all-types-back">就活タイプ</button><span aria-hidden="true">›</span><span aria-current="page">${esc(entry.name)}</span></nav><div class="type-info-hero ${vignetteCodes.includes(code)?'has-vignette':''}"><p class="page-kicker">就活タイプ紹介</p><h1 class="type-info-title"><span class="visually-hidden">${esc(entry.name)}（${code}）</span><img class="original-result-title" src="assets/result-titles/${code}.webp" alt=""></h1>${character(index,code)}</div><h2>${esc(r.catchCopy)}</h2><p>${esc(p.strength)}</p><section class="ti-sec"><h2>あなたの強み</h2><p class="ti-lead">${esc(r.s01.oneline)}</p><p>${esc(r.s01.strengths)}</p></section><section class="ti-sec"><h2>つまずきやすいところ</h2><p class="ti-lead">${esc(r.s02.oneline)}</p><p>${esc(r.s02.cover)}</p></section><section class="ti-sec"><h2>グループディスカッションでの役割</h2><p class="ti-lead">${esc(r.s03.role)}</p><p>${esc(r.s03.behavior)}</p></section><section class="ti-sec"><h2>向いている仕事</h2><p class="ti-lead">${esc(r.s08.jobs)}</p><p>相性の良い業界：${esc(r.s08.industries)}</p></section><section class="ti-sec"><h2>今日からできること</h2><p>${esc(p.actions[0])}</p></section><p class="type-info-note">これはタイプの紹介です。あなた自身の結果は、45問の回答から確認できます。</p><button class="cta" id="type-diagnose">自分のタイプを診断する</button></section>`;document.getElementById('all-types-back').onclick=showTypes;document.getElementById('crumb-home').onclick=home;document.getElementById('type-diagnose').onclick=diagnosisEntry;scrollTop();}
function mountSiteNavigation(){const nav=document.createElement('nav');nav.className='site-bottom-nav';nav.setAttribute('aria-label','メインメニュー');const icons={diagnose:'<path d="M8 5h8l3 4v11H5V9zM9 12h6M9 16h4M9 3h6v4H9z"/>',types:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',consult:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18M8 15h3"/>',line:'<path d="M20 11a8 8 0 0 1-8 8H7l-4 3v-6a9 9 0 1 1 17-5zM7 10h9M7 14h6"/>',profiles:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2c0-7 16-7 16 0v2"/>'};const items=[['diagnose','診断','診断を受ける'],['types','就活タイプ','就活タイプ'],['consult','就活面談','就活面談'],['line','公式LINE','公式LINE'],['profiles','メンター紹介','メンターのプロフィール']];nav.innerHTML=items.map(([id,label,aria])=>`<button data-main-nav="${id}" aria-label="${aria}"><span><svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg></span>${label}</button>`).join('');document.body.append(nav);const actions={diagnose:diagnosisEntry,types:showTypes,consult:showConsultation,line:showLine,profiles:showAdvisors};nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{quizCleanup();actions[b.dataset.mainNav]();});function refresh(){const selected=step===70||step===71?'types':step===64||step===65?'profiles':step===72?'consult':step===73?'line':'diagnose';nav.querySelectorAll('button').forEach(b=>{if(b.dataset.mainNav===selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});document.body.classList.toggle('is-answering',step>=0&&step<61);document.body.classList.toggle('is-beyond',step===72);document.body.classList.toggle('is-hatching',step===61);}new MutationObserver(refresh).observe(app,{childList:true});refresh();}
